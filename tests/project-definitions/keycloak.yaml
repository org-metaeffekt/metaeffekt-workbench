projectProperties:
  project:
    id: "ae-workbench"
    name: "metaeffekt-workbench"
    version: "HEAD-SNAPSHOT"
    tenant: "ae"
  assets:
    - id: "keycloak"
      name: "Keycloak"
      version: "25.0.4"
      reference: "inventories/example-reference-inventory/inventory"
      assessmentId: "demo"
      context: "default"
      urlResolver:
        url: "file:/tests/resources/input-inventories/keycloak-inventory.xlsx"

dashboards:
  - assetIds: [ "keycloak" ]

reports:
  - assetIds: [ "keycloak" ]
    types: [ "VR", "CR" ]
    organization: "metaeffekt"
    classificationRating: "DEFAULT"
    controlRating: "DEFAULT"
    productName: "Keycloak"
    productVersion: "25.0.4"
    productWatermark: "Keycloak"
    overviewAdvisors: [ "CERT_FR" ]
    locales: [ "de_DE" ]

options:
  enrichment:
    securityPolicyFile: "policies/security-policy/security-policy.json"
    securityPolicyActiveIds: [ "base_configuration" ]