projectProperties:
  project:
    id: "ae-workbench"
    name: "metaeffekt-workbench"
    version: "HEAD-SNAPSHOT"
    tenant: "ae"
  assets:
    - id: "cisco-catalyst"
      name: "Cisco Catalyst SD-WAN Manager"
      version: "20.12.5.2"
      reference: "inventories/example-reference-inventory/inventory"
      assessmentId: "demo"
      context: "default"
      urlResolver:
        url: "file:${workbenchDir}/tests/resources/input-inventories/cisco-catalyst-inventory.xls"

dashboards:
  - assetIds: [ "cisco-catalyst" ]

reports:
  - assetIds: [ "cisco-catalyst" ]
    types: [ "VR" ]
    organization: "metaeffekt"
    classificationRating: "DEFAULT"
    controlRating: "DEFAULT"
    productName: "Cisco Catalyst SD-WAN Manager"
    productVersion: "20.12.5.2"
    productWatermark: "Sample"
    overviewAdvisors: [ "CERT_FR" ]
    locales: [ "de_DE" ]

options:
  enrichment:
    securityPolicyFile: "policies/security-policy/security-policy.json"
    securityPolicyActiveIds: [ "base_configuration" ]