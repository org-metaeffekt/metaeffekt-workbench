name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version. Must be valid semantic versioning.'
        required: true
        type: string
      ae-core-version:
        description: 'Metaeffekt Core version to use for this release.'
        required: true
        type: string
      ae-artifact-analysis-version:
        description: 'Metaeffekt Artifact Analysis version to use for this release.'
        required: true
        type: string
      ae-kontinuum-version:
        description: 'Metaeffekt Kontinuum version tag or branch to utilize for testing.'
        default: main
        required: false
        type: string
env:
  MIRROR_URL: "https://metaeffekt.com/mirror/ae-vulnerability-mirror/ae-mirror-index_gen6-external.tar.gz"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@metaeffekt.com"
          git config --local user.name "github-actions[bot]"

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Replace versions in parent processors
        run: |
          sed -i -E 's|<ae.core.version>[^<]*</ae.core.version>|<ae.core.version>${{ inputs.ae-core-version }}</ae.core.version>|' templates/report-template/pom.xml
          sed -i -E 's|<ae.artifact.analysis.version>[^<]*</ae.artifact.analysis.version>|<ae.artifact.analysis.version>${{ inputs.ae-artifact-analysis-version }}</ae.artifact.analysis.version>|' templates/report-template/pom.xml

      # Commit the overrides on a throwaway commit and publish only the tag, so main is never modified.
      - name: Create release commit and tag
        run: |
          git add templates/report-template/pom.xml
          git commit -m "Release ${{ inputs.version }}" || echo "No changes to commit"
          git tag -f "${{ inputs.version }}"
          # --force allows re-running a failed release; it does not affect main.
          git push --force origin "refs/tags/${{ inputs.version }}"

      - name: Create full source archive
        run: |
          git archive --format=tar.gz \
            --prefix="metaeffekt-workbench-${{ inputs.version }}/" \
            --output="metaeffekt-workbench-${{ inputs.version }}.tar.gz" \
            "${{ inputs.version }}"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: false
          prerelease: false
          files: metaeffekt-workbench-${{ inputs.version }}.tar.gz