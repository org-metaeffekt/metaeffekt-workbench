# STRIDE-LM + QUA Threat Definitions (Optimized)
#
# Resolution pipeline (run independently for basedOn and relatedTo):
#   1. CAPEC tree collection  -> gather CAPECs along hierarchy (per scope)
#   2. CAPEC exclusion         -> subtract excluded CAPECs (include-wins)
#   3. CWE derivation          -> from surviving CAPECs, derive CWEs (subtree)
#   4. CWE inclusion           -> add directly referenced CWEs (per scope)
#   5. CWE exclusion           -> subtract excluded CWEs (include-wins)
#
#   include-wins: direct refs in the same section override excludes at the same tier.
#   basedOn and relatedTo produce separate, independent result sets.
#   scope: subtree (default) | node-only | descendants-only
#
#   Over-scoped includes (>80% of subtree excluded) are narrowed to node-only
#   with explicit CWE listings for the surviving entries.

